<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hukoomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="hukoomCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="800" height="500" rx="12" fill="url(#hukoomBg)"/>
  <rect width="800" height="500" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Top App Bar -->
  <rect width="800" height="60" fill="#090d16" rx="12"/>
  <rect y="48" width="800" height="12" fill="#090d16"/>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <circle cx="28" cy="30" r="5" fill="#ef4444" fill-opacity="0.6"/>
  <circle cx="44" cy="30" r="5" fill="#f59e0b" fill-opacity="0.6"/>
  <circle cx="60" cy="30" r="5" fill="#10b981" fill-opacity="0.6"/>

  <text x="90" y="36" fill="#f3f4f6" font-family="'Cinzel', serif" font-weight="700" font-size="16" letter-spacing="1">HUKOOM</text>
  <text x="175" y="35" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">| ON-DEMAND SERVICES HUB</text>

  <!-- Role Toggle Pill -->
  <rect x="520" y="16" width="240" height="28" rx="14" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="522" y="18" width="118" height="24" rx="12" fill="#e5b067"/>
  <text x="548" y="34" fill="#0f172a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CONSUMER</text>
  <text x="660" y="34" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10">PROVIDER RBAC</text>

  <!-- Left Sidebar / Category Filter -->
  <g transform="translate(30, 80)">
    <rect width="220" height="380" rx="10" fill="url(#hukoomCard)" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="20" y="36" fill="#e5b067" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SERVICE CATEGORIES</text>

    <!-- Categories -->
    <rect x="16" y="56" width="188" height="40" rx="6" fill="#e5b067" fill-opacity="0.12" stroke="#e5b067" stroke-opacity="0.3"/>
    <text x="36" y="81" fill="#e5b067" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">⚡ Electrical Diagnostics</text>

    <rect x="16" y="104" width="188" height="40" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <text x="36" y="129" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">🔧 Plumbing &amp; Repairs</text>

    <rect x="16" y="152" width="188" height="40" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <text x="36" y="177" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">🧹 HVAC &amp; Climate</text>

    <rect x="16" y="200" width="188" height="40" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <text x="36" y="225" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">🏠 Home Maintenance</text>

    <!-- Dispatch Status Box -->
    <rect x="16" y="270" width="188" height="90" rx="8" fill="#090d16" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="28" y="296" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">● DISPATCH ACTIVE</text>
    <text x="28" y="320" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Vetted service specialists responding in &lt; 15 mins</text>
  </g>

  <!-- Right Panel / Interactive Booking Calendar & Service List -->
  <g transform="translate(270, 80)">
    <rect width="490" height="380" rx="10" fill="url(#hukoomCard)" stroke="#ffffff" stroke-opacity="0.06"/>

    <text x="24" y="36" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Book Certified Specialist</text>
    <text x="24" y="58" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Direct coordination with verified local technicians</text>

    <!-- Schedule Bar -->
    <rect x="24" y="80" width="442" height="64" rx="8" fill="#090d16" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="44" y="106" fill="#e5b067" font-family="'JetBrains Mono', monospace" font-size="10">SLOT SELECTION</text>
    <text x="44" y="128" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Tomorrow, 10:00 AM – 12:00 PM</text>
    <rect x="340" y="96" width="110" height="32" rx="6" fill="#e5b067" fill-opacity="0.15" stroke="#e5b067" stroke-opacity="0.3"/>
    <text x="360" y="116" fill="#e5b067" font-family="'JetBrains Mono', monospace" font-size="11">CHANGE ↻</text>

    <!-- Vendor Card 1 -->
    <rect x="24" y="160" width="442" height="90" rx="8" fill="#131c2e" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="60" cy="205" r="22" fill="#1e293b"/>
    <text x="52" y="211" fill="#e5b067" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">AK</text>
    <text x="96" y="196" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Anil Kumar — Master Electrician</text>
    <text x="96" y="218" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">4.9 ★ (120+ jobs) • 8 yrs experience • Verified Badge</text>
    <text x="370" y="200" fill="#e5b067" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">₹499</text>
    <text x="370" y="218" fill="#6b7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">inspection</text>

    <!-- Vendor Card 2 -->
    <rect x="24" y="264" width="442" height="90" rx="8" fill="#131c2e" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="60" cy="309" r="22" fill="#1e293b"/>
    <text x="52" y="315" fill="#e5b067" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">RS</text>
    <text x="96" y="300" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Rohit Sharma — Circuit &amp; Wiring Tech</text>
    <text x="96" y="322" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">4.8 ★ (85+ jobs) • Commercial &amp; Residential</text>
    <text x="370" y="304" fill="#e5b067" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">₹399</text>
    <text x="370" y="322" fill="#6b7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">inspection</text>
  </g>
</svg>
